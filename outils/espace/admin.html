<section class="route ee" data-route="/admin" id="r-admin">
  <div class="page-head shell">
    <p class="label">Espace agence</p>
    <h1 class="display d-xl" style="margin-top:14px;">Estimations <em>et comptes.</em></h1>
    <p class="lede" id="ad-lede">Toutes les demandes reçues par le site, leur avancement et vos notes.</p>
  </div>
  <div class="shell">
    <div class="ee-wrap" id="ad-load"><div class="ee-load"></div></div>
    <div class="ee-wrap" id="ad-no" hidden>
      <div class="ee-empty"><p style="margin:0;" id="ad-no-txt">Cet espace est réservé à l'agence. Connectez-vous avec votre compte administrateur.</p><a class="btn btn-primary" href="/mon-espace/">Me connecter <span class="arw">→</span></a></div>
    </div>
    <div class="ee-wide" id="ad-in" hidden>
      <div class="ee-stats" id="ad-stats"></div>
      <div class="ee-tabs" role="group" aria-label="Vue"><button type="button" class="pill" data-vue="demandes" aria-pressed="true">Demandes</button><button type="button" class="pill" data-vue="comptes" aria-pressed="false">Comptes</button></div>
      <div id="ad-demandes">
        <div class="ee-tools">
          <input type="search" id="ad-q" placeholder="Nom, e-mail, téléphone, commune, référence…" aria-label="Rechercher">
          <select id="ad-statut" aria-label="Statut"><option value="">Tous les statuts</option></select>
          <a class="btn" href="/api/espace/admin/export.csv?quoi=demandes" download>Export CSV</a>
        </div>
        <div class="ee-rows" id="ad-rows"></div>
      </div>
      <div id="ad-comptes" hidden>
        <div class="ee-tools">
          <input type="search" id="ad-qc" placeholder="Nom, e-mail, téléphone…" aria-label="Rechercher un compte">
          <a class="btn" href="/api/espace/admin/export.csv?quoi=comptes" download>Export CSV</a>
        </div>
        <div class="ee-rows" id="ad-crows"></div>
      </div>
    </div>
  </div>
</section>
