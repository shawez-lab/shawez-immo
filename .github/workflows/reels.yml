name: Tests du traitement D1 des Reels
on:
  push:
    paths: ['functions/_lib/reels.js', 'functions/api/reels/**', 'assets/admin-reels.*', 'admin/reels/**', 'outils/reels/**', '.github/workflows/reels.yml']
  pull_request:
    paths: ['functions/_lib/reels.js', 'functions/api/reels/**', 'assets/admin-reels.*', 'admin/reels/**', 'outils/reels/**', '.github/workflows/reels.yml']
permissions:
  contents: read
concurrency:
  group: reels-collecte
  cancel-in-progress: false
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test outils/reels/test.mjs
