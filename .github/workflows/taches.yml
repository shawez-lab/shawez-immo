name: Tâches à heure fixe (rappels de visite)

# Rappel de visite d'estimation au vendeur, la veille à 18 h (heure de Paris).
# Chaque heure de la soirée, cette action appelle /api/espace/taches : la route envoie les rappels dus, une seule fois
# chacun, et ne fait rien d'autre (aucune donnée n'est rendue). Les horaires sont en UTC : 15 h 07 à 22 h 07 couvre
# 18 h à Paris été comme hiver. Le site le fait aussi de lui-même au passage des visiteurs en soirée ; ceci est la garantie.
on:
  schedule:
    - cron: '7 15-22 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  taches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rappels de visite dus
        run: curl -sS -m 30 --retry 2 --retry-delay 20 https://shawez-immo.com/api/espace/taches
