name: Synchronisation des annonces

# Trois passages par heure de 6 h à 23 h (heure de Paris) : une annonce modifiée chez l'agence est en
# ligne sur shawez-immo.com en moins de 25 minutes (décision de Shawez, 02/11/2026 : « dès qu'une annonce
# est modifiée sur le site de l'agence, il faut que ça soit fait tout de suite sur mon site »).
#
# Pourquoi trois passages sans exploser le compte : chaque passage commence par outils/sentinelle.py, qui
# lit seulement les pages de liste de l'agence (environ 25 s) et s'arrête net si rien n'a bougé. La
# synchronisation complète, qui coûte 3 à 5 minutes, ne part que lorsqu'il y a vraiment du nouveau, ou
# toutes les 4 heures pour rattraper ce qui ne se voit pas depuis la liste.
#
# Le 29, 30 et 31 octobre 2026, GitHub a refusé NEUF passages d'affilée : « The job was not started because
# recent account payments have failed or your spending limit needs to be increased ». Le site de Shawez est
# donc resté trois jours en retard sans que personne ne le sache, parce qu'un passage refusé ne produit
# aucun journal. C'est la tâche planifiée « Gardien de la synchronisation » qui surveille ce cas : elle
# compare l'heure du dernier commit de synchronisation et prévient Shawez si ça dépasse deux heures.
#
# GitHub ne connaît que l'heure UTC : 5 h-21 h UTC couvre été et hiver, le script vérifie l'heure de Paris.
# Vidéos Instagram : une fois par heure, au premier passage.
on:
  schedule:
    - cron: '6 5-21 * * *'
    - cron: '26 5-21 * * *'
    - cron: '46 5-21 * * *'
  workflow_dispatch:
    inputs:
      complet:
        description: Forcer la synchronisation complète sans passer par la sentinelle (oui / non)
        required: false
        default: 'oui'

permissions:
  contents: write

concurrency:
  group: sync-annonces
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Heure de Paris
        id: heure
        run: |
          h=$(TZ=Europe/Paris date +%H); m=$(date +%M)
          echo "Heure à Paris : $h h $m"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$h" -ge 6 ] && [ "$h" -le 23 ]; }; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$m" -lt 15 ]; then echo "reels=1" >> "$GITHUB_OUTPUT"; else echo "reels=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.heure.outputs.go == '1'
        with:
          ref: main

      - uses: actions/setup-python@v6
        if: steps.heure.outputs.go == '1'
        with:
          python-version: '3.12'

      # La sentinelle n'a besoin de rien : elle ne lit que du texte. Pillow n'est installé que si on
      # synchronise vraiment, ce qui fait gagner une vingtaine de secondes sur la majorité des passages.
      - name: Sentinelle — quelque chose a-t-il bougé chez l'agence ?
        id: veille
        if: steps.heure.outputs.go == '1'
        env:
          TZ: Europe/Paris
        run: |
          if [ "${{ github.event.inputs.complet }}" = "oui" ]; then
            echo "Lancement manuel : synchronisation complète demandée."
            echo "change=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          set +e
          python3 outils/sentinelle.py
          code=$?
          set -e
          if [ "$code" = "10" ]; then echo "change=1" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then echo "change=0" >> "$GITHUB_OUTPUT"
          else echo "Sentinelle en échec (code $code) : on synchronise par précaution."; echo "change=1" >> "$GITHUB_OUTPUT"; fi

      - name: Dépendances
        if: steps.heure.outputs.go == '1' && (steps.veille.outputs.change == '1' || steps.heure.outputs.reels == '1')
        run: pip install --quiet 'pillow>=11.3'   # AVIF compris (photos des fiches /biens/…)

      - name: Outils vidéo (vidéos Instagram des biens)
        if: steps.heure.outputs.go == '1' && steps.heure.outputs.reels == '1'
        timeout-minutes: 6
        continue-on-error: true   # miroir apt lent : on passe, les annonces sont synchronisées quand même
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-fra >/dev/null

      - name: Vidéos des biens reprises d'Instagram (version qualité, jamais celle avec le prix incrusté)
        if: steps.heure.outputs.go == '1' && steps.heure.outputs.reels == '1'
        timeout-minutes: 15
        continue-on-error: true   # Instagram indisponible : les annonces sont quand même synchronisées
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        run: python3 outils/biens/reels.py

      - name: Lecture des diagnostics publics (OCR local, sans modèle)
        if: steps.heure.outputs.go == '1' && steps.veille.outputs.change == '1'
        timeout-minutes: 16
        continue-on-error: true   # installation impossible : les annonces sont synchronisées quand même, sans relecture des diagnostics
        run: |
          # L'étape « Outils vidéo » peut dépasser son délai en laissant apt tourner : on le laisse finir, il installe aussi tesseract.
          for i in $(seq 60); do
            command -v tesseract >/dev/null && exit 0
            pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
            sleep 10
          done
          command -v tesseract >/dev/null && exit 0
          sudo dpkg --configure -a || true
          sudo apt-get -o DPkg::Lock::Timeout=180 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y -qq --no-install-recommends tesseract-ocr
          tesseract --version | head -1

      - name: Synchronisation
        if: steps.heure.outputs.go == '1' && steps.veille.outputs.change == '1'
        env:
          TZ: Europe/Paris
        run: python3 outils/sync_annonces.py

      - name: Construction (flux RSS, balises des pages)
        if: steps.heure.outputs.go == '1' && (steps.veille.outputs.change == '1' || steps.heure.outputs.reels == '1')
        run: python3 outils/build.py

      # Posée seulement après une synchronisation réussie : si la synchro échoue, l'empreinte reste
      # l'ancienne et le passage suivant réessaie au lieu de croire que tout est à jour.
      - name: Poser l'empreinte de l'agence
        if: steps.heure.outputs.go == '1' && steps.veille.outputs.change == '1'
        env:
          TZ: Europe/Paris
        run: python3 outils/sentinelle.py --poser

      - name: Commit sur main s'il y a des changements
        if: steps.heure.outputs.go == '1' && (steps.veille.outputs.change == '1' || steps.heure.outputs.reels == '1')
        run: |
          git config user.name "sync-annonces"
          git config user.email "sync-annonces@users.noreply.github.com"
          git add -A   # tout ce que la synchro et build.py ont regénéré (fiches, pages prix par commune, maillage, sitemap)
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Annonces : synchronisation du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Alerte si une fiche a été mise de côté ou si la lecture a échoué
        if: steps.heure.outputs.go == '1' && steps.veille.outputs.change == '1'
        run: |
          if [ -f de-claude/alerte-sync.md ]; then
            echo "::error::$(tr '\n' ' ' < de-claude/alerte-sync.md | cut -c1-300)"
            exit 1   # passage en rouge = e-mail GitHub à Shawez ; les autres annonces sont déjà publiées
          fi
