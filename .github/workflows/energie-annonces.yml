name: Tests DPE et GES sur fiches réelles
on:
  push:
    paths: ['outils/sync_annonces.py', 'outils/energie_annonces.py', 'outils/tests-annonces/**', '.github/workflows/energie-annonces.yml']
  pull_request:
    paths: ['outils/sync_annonces.py', 'outils/energie_annonces.py', 'outils/tests-annonces/**', '.github/workflows/energie-annonces.yml']
permissions:
  contents: read
jobs:
  energie:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            outils
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install 'pillow>=11.3'
      - run: python3 -m unittest discover -s outils/tests-annonces -v
