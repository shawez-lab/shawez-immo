name: IndexNow (Bing, ChatGPT Search, Yandex, Seznam, Naver)

# À chaque poussée sur main : signale à IndexNow les pages HTML ajoutées, modifiées ou supprimées par cette poussée
# (outils/indexnow.py : ignore /admin/, /mon-espace/, de-claude/, outils/, les pages noindex ; 10 000 URL au plus).
# Une fois par jour : les pages changées par les commits automatiques des dernières 25 h (fiches /biens/ de
# sync-annonces, construction du site), car un commit fait avec GITHUB_TOKEN ne relance pas ce workflow.
# Lancement manuel : tout le sitemap. Clé publique : /<clé>.txt à la racine (= outils/indexnow-key.txt), aucun secret.
# Google n'utilise pas IndexNow : lui passe par la Search Console (sitemap déclaré).
on:
  push:
    branches: [main]
    paths:
      - '**.html'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Liste des URL (essai, sans envoi)
        id: liste
        run: |
          case "${{ github.event_name }}" in
            push)     ARGS="--avant ${{ github.event.before }} --apres ${{ github.sha }}" ;;
            schedule) ARGS="--depuis '25 hours ago'" ;;
            *)        ARGS="--sitemap" ;;
          esac
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          eval python3 outils/indexnow.py $ARGS --essai | tee liste.txt
          if grep -q "^Aucune page" liste.txt; then echo "vide=1" >> "$GITHUB_OUTPUT"; fi

      - name: Attendre la publication Cloudflare Pages (clé servie)
        if: steps.liste.outputs.vide != '1'
        run: |
          KEY=$(cat outils/indexnow-key.txt)
          for i in $(seq 1 30); do
            if curl -fsS "https://shawez-immo.com/${KEY}.txt" | grep -q "$KEY"; then echo "Clé servie."; break; fi
            sleep 15
          done
          # laisser à Cloudflare Pages le temps de publier les pages de cette poussée
          if [ "${{ github.event_name }}" = "push" ]; then sleep 90; fi

      - name: Envoyer à IndexNow
        if: steps.liste.outputs.vide != '1'
        # ARGS passé par variable (comme à l'étape « Liste ») : avec ${{ }} écrit en dur, eval recoupait
        # '25 hours ago' en trois mots et le passage quotidien échouait (« unrecognized arguments: hours ago »).
        env:
          ARGS: ${{ steps.liste.outputs.args }}
        run: eval python3 outils/indexnow.py $ARGS
