name: IndexNow (Bing, Yandex, Naver, Seznam)

# À chaque mise en ligne d'une page : signale aux moteurs compatibles IndexNow toutes les URL du sitemap.
# Google n'utilise pas IndexNow : lui passe par la Search Console (sitemap déclaré + demandes d'indexation).
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  schedule:
    - cron: '17 5 * * 1'   # lundi 7 h 17 Paris : rappel hebdomadaire de tout le sitemap
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Attendre la publication Cloudflare Pages (clé IndexNow servie)
        run: |
          KEY=$(cat outils/indexnow-key.txt)
          for i in $(seq 1 30); do
            if curl -fsS "https://shawez-immo.com/${KEY}.txt" | grep -q "$KEY"; then echo "Clé servie."; exit 0; fi
            sleep 15
          done
          echo "La clé n'est pas servie après 7 min 30 : on tente quand même."

      - name: Envoyer les URL du sitemap à IndexNow
        run: |
          KEY=$(cat outils/indexnow-key.txt)
          python3 - "$KEY" <<'PY'
          import sys, json, re, urllib.request
          key = sys.argv[1]
          xml = open("sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>\s*(https://shawez-immo\.com/[^<\s]*)\s*</loc>", xml)
          urls = [u for u in urls if not re.search(r"/(admin|mon-espace|merci|biens-a-vendre|estimation-en-ligne)/", u)]
          body = json.dumps({"host": "shawez-immo.com", "key": key, "keyLocation": f"https://shawez-immo.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("IndexNow:", r.status, len(urls), "URL")
          except urllib.error.HTTPError as e:
              print("IndexNow HTTP", e.code, e.read()[:300]); sys.exit(0 if e.code in (200, 202) else 1)
          PY
